server:
  port: 8080

spring:
  application:
    name: ewm-main-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${EWM_MAIN_DB_URL:jdbc:postgresql://localhost:6542/ewm-main}
    username: ${EWM_MAIN_DB_USERNAME:main}
    password: ${EWM_MAIN_DB_PASSWORD:main}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  jackson:
    mapper:
      default-view-inclusion: true

  sql:
    init:
      mode: always

stats-server:
  url: ${STATS_SERVER_URL:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
